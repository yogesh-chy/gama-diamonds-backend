<!DOCTYPE html>
<html>
  <body style="font-family: Arial, sans-serif; background:#f7f5f2; padding:24px;">
    <table role="presentation" style="max-width:480px; margin:0 auto; background:#ffffff; border-radius:8px; padding:32px;">
      <tr>
        <td>
          <h2 style="margin:0 0 16px; color:#1a1a1a;">Your login code</h2>
          <p style="color:#444; font-size:15px; line-height:1.5;">
            Use the code below to sign in to Gama Diamonds. It expires in
            {{ expiry_minutes }} minutes.
          </p>
          <p style="font-size:32px; font-weight:bold; letter-spacing:8px; text-align:center; margin:24px 0; color:#8a6d3b;">
            {{ code }}
          </p>
          <p style="color:#888; font-size:13px; line-height:1.5;">
            Didn't request this? You can safely ignore this email — no
            account changes will be made without this code.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
